[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alice-agent"
version = "0.2.0"
description = "AI web search agent for DDVB branding agency using Yandex AI Studio (Alice AI LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "trafilatura>=1.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[project.scripts]
alice = "alice_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

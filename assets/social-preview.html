<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  /* Kelva self-hosted fonts — absolute file:// paths so Chrome headless loads them at render time.
     The brand design files (github-social-app.jsx, lockups-app.jsx) render in LINE Seed JP. */
  @font-face {
    font-family: 'LINE Seed JP';
    font-weight: 400; font-style: normal; font-display: block;
    src: url('file:///D:/Downloads/SynologyDrive/kelvatech/SharedWorkspace/assets/fonts/lineseed/lineseedjp-400-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'LINE Seed JP';
    font-weight: 700; font-style: normal; font-display: block;
    src: url('file:///D:/Downloads/SynologyDrive/kelvatech/SharedWorkspace/assets/fonts/lineseed/lineseedjp-700-latin.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 400; font-style: normal; font-display: block;
    src: url('file:///D:/Downloads/SynologyDrive/kelvatech/SharedWorkspace/assets/fonts/lineseed/jetbrainsmono-400-latin-fs.woff2') format('woff2');
  }
  @font-face {
    font-family: 'JetBrains Mono';
    font-weight: 500; font-style: normal; font-display: block;
    src: url('file:///D:/Downloads/SynologyDrive/kelvatech/SharedWorkspace/assets/fonts/lineseed/jetbrainsmono-500-latin-fs.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    /* brand-spec.json tokens */
    --charcoal: #1A1A2E;
    --cream: #F5F0EB;
    /* Alice's agent hue — Peach, per the Kelva Agent Sub-Brand System */
    --agent: #F2A679;
    --label-dark: rgba(245,240,235,0.55);
  }

  html, body { width: 1280px; height: 640px; }

  body {
    font-family: 'LINE Seed JP', 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  /* ── CardAgent · charcoal surface, agent-color accent (github-social-app.jsx) ── */
  .card {
    width: 1280px; height: 640px; position: relative; overflow: hidden;
    background: var(--charcoal);
  }

  /* Rhombus dot pattern — agent color, opacity 0.10, 50px density (PatternBg) */
  .pattern { position: absolute; inset: 0; pointer-events: none; }

  .mono {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  }
  .mono-label {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
  }

  /* top bar */
  .top {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 36px 56px; display: flex;
    justify-content: space-between; align-items: center; z-index: 2;
  }
  .top-left { display: flex; align-items: center; gap: 14px; }
  .role { color: var(--agent); }

  /* body */
  .body {
    position: absolute; inset: 120px 56px 120px 64px;
    display: flex; align-items: center; gap: 60px; z-index: 2;
  }
  .col { flex: 1; min-width: 0; }
  .repo-path { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 22px; color: var(--label-dark); }
  .title {
    font-size: 132px; font-weight: 700; letter-spacing: -3px;
    line-height: 0.95; color: var(--cream); margin: 12px 0 0;
  }
  .desc {
    font-size: 22px; color: rgba(245,240,235,0.65);
    margin-top: 18px; max-width: 600px; line-height: 1.4; font-weight: 400;
  }

  /* footer */
  .footer {
    position: absolute; bottom: 0; left: 0; right: 0;
    padding: 36px 56px; display: flex;
    justify-content: space-between; align-items: center; z-index: 2;
  }
  .footer-left { display: flex; align-items: center; gap: 10px; }
  .dot { width: 12px; height: 12px; border-radius: 999px; background: var(--agent); display: inline-block; }
  .footer-name { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 15px; color: var(--cream); }
</style>
</head>
<body>
  <div class="card">
    <!-- Rhombus dot pattern -->
    <svg class="pattern" viewBox="0 0 1280 640" width="100%" height="100%" preserveAspectRatio="none">
      <defs>
        <pattern id="rhombus" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M 25 21 L 29 25 L 25 29 L 21 25 Z" fill="#F2A679" opacity="0.10" />
        </pattern>
      </defs>
      <rect width="1280" height="640" fill="url(#rhombus)" />
    </svg>

    <!-- top bar -->
    <div class="top">
      <div class="top-left">
        <!-- KMark · offset-rhombus, agent fill -->
        <svg viewBox="0 0 100 100" width="36" height="36" style="display:block">
          <path d="M 20 50 L 45 25 L 45 75 Z" fill="#F2A679" />
          <path d="M 45 25 L 80 10 L 60 50 L 80 90 L 45 75 Z" fill="#F2A679" />
        </svg>
        <span class="mono-label" style="color:var(--label-dark)">kelva &middot; agent</span>
      </div>
      <span class="mono-label role">Web search &middot; Yandex AI</span>
    </div>

    <!-- body -->
    <div class="body">
      <svg viewBox="0 0 100 100" width="220" height="220" style="display:block;flex-shrink:0">
        <path d="M 20 50 L 45 25 L 45 75 Z" fill="#F2A679" />
        <path d="M 45 25 L 80 10 L 60 50 L 80 90 L 45 75 Z" fill="#F2A679" />
      </svg>
      <div class="col">
        <div class="repo-path">cybernexcorps/alice-ai-llm-websearch-agent</div>
        <h1 class="title">Alice</h1>
        <div class="desc">AI web search agent on Yandex AI Studio. Search is built in &mdash; no separate API. CLI and browser.</div>
      </div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="footer-left">
        <span class="dot"></span>
        <span class="footer-name">alice</span>
      </div>
      <span class="mono-label" style="color:var(--label-dark)">github.com/cybernexcorps/alice-ai-llm-websearch-agent</span>
    </div>
  </div>
</body>
</html>
